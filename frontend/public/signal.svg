  </defs>
  <!-- outer amber circle -->
  <circle cx="16" cy="16" r="14" fill="url(#g)"/>
  <!-- inner dark hole (matches app bg) -->
  <circle cx="16" cy="16" r="9" fill="#0f0d0b"/>
  <!-- inner amber dot -->
  <circle cx="16" cy="16" r="5" fill="#e89545"/>
