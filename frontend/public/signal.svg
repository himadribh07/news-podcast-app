<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- outer glow ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#e89545" stroke-width="0.5" opacity="0.3"/>
  <defs>
    <radialGradient id="g" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#f5b870"/>
      <stop offset="100%" stop-color="#c97a2b"/>
